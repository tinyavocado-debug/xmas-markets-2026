<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sleigh Route · Brush & Link</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c-shell.css">
<script src="data.js"></script>
<script src="c-shell.js"></script>
<style>
  #main { display: grid; grid-template-rows: var(--maph, 44%) 12px 34px 1fr; }
  #divider { cursor: row-resize; background: var(--ink); display: grid; place-items: center; touch-action: none; position: relative; z-index: 700; }
  #divider::before { content: ''; width: 46px; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, #fff 0 6px, var(--red) 6px 12px); }
  #divider:hover::before, body.resizing #divider::before { width: 80px; }
  #divider::after { content: 'drag to resize · double-click to reset'; position: absolute; left: calc(50% + 52px); font: 10px 'DM Mono', monospace; color: #fff; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #divider:hover::after { opacity: .75; }
  body.resizing, body.resizing * { cursor: row-resize !important; user-select: none; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12.5px; border-bottom: 2px solid var(--ink); background: #fff; }
  #bar .chip { font-family: 'DM Mono', monospace; font-size: 11.5px; padding: 2px 8px; border-radius: 12px; background: #f1ece2; }
  #bar .chip.on { background: var(--ink); color: #fff; }
  #bar .grp { display: flex; gap: 3px; align-items: center; font-size: 12px; }
  #bar .grp button.on { background: var(--ink); color: #fff; }
  #bar button { border: 1.5px solid var(--ink); background: #fff; border-radius: 5px; cursor: pointer; font-size: 11px; padding: 2px 7px; }
  #tl { overflow-y: auto; position: relative; user-select: none; }
  .inner { position: relative; }
  .tl-head { position: sticky; top: 0; z-index: 6; background: var(--bg); display: grid; grid-template-columns: 300px 1fr; border-bottom: 2px solid var(--ink); }
  .tl-head .label { font: 10.5px 'DM Mono', monospace; padding: 17px 12px; text-transform: uppercase; opacity: .7; }
  .months { position: relative; height: 46px; font: 11px 'DM Mono', monospace; cursor: crosshair; }
  .months span { position: absolute; pointer-events: none; }
  .months .mo { top: 2px; padding-left: 4px; border-left: 1px solid var(--ink); height: 42px; font-weight: 600; }
  .months .dn { top: 30px; transform: translateX(-50%); font-size: 9px; opacity: .45; }
  .months .dn.we { opacity: 1; font-weight: 700; }
  .months .dn.wk::before { content: ''; position: absolute; left: 50%; top: -4px; height: 3px; border-left: 1px solid var(--ink); opacity: .5; }
  .months .hov { top: 13px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 9.5px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; z-index: 3; display: none; }
  .grid-lines .hovline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--ink); opacity: .5; display: none; }
  .months span.todaylbl { top: 15px; height: auto; background: var(--red); color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 3px; }
  .reg { font: 10.5px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .5px; padding: 8px 12px 3px; display: flex; align-items: center; gap: 6px; }
  .reg i { width: 9px; height: 9px; border-radius: 2px; }
  .row .name { display: flex; align-items: center; gap: 6px; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .row .nm:hover { text-decoration: underline; }
  .row .links { display: flex; gap: 2px; flex: none; }
  .row .links a, .row .links span { text-decoration: none; font-size: 12px; width: 22px; height: 20px; display: grid; place-items: center; border-radius: 5px; }
  .row .links a:hover { background: #fff; box-shadow: 0 0 0 1.5px var(--ink); }
  .row .links .nolink { opacity: .2; cursor: help; }
  .row { display: grid; grid-template-columns: 300px 1fr; border-bottom: 1px solid var(--line); transition: opacity .15s; }
  .row.hl { background: #fff1d6; }
  .row.dim { opacity: .28; }
  .row.picked .name { color: var(--red); font-weight: 600; }
  .row .name { font-size: 12.5px; padding: 4px 8px 4px 12px; white-space: nowrap; overflow: hidden; }
  .row .name small { font: 10.5px 'DM Mono', monospace; opacity: .6; margin-left: 4px; }
  .track { position: relative; height: 24px; cursor: crosshair; }
  .bar { position: absolute; top: 6px; height: 12px; border-radius: 6px; min-width: 6px; pointer-events: none; }
  .bar.select { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 4px, transparent 4px 8px) !important; }
  .tbd { position: absolute; top: 5px; left: 6px; font: 10.5px 'DM Mono', monospace; opacity: .6; pointer-events: none; }
  .grid-lines { position: absolute; top: 0; bottom: 0; left: 300px; right: 0; pointer-events: none; z-index: 1; }
  .grid-lines .wkend { position: absolute; top: 0; bottom: 0; background: rgba(29,42,36,.035); }
  .grid-lines .today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); }
  .tripmark { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--tc); opacity: .85; }
  .tripmark.on { border-left-style: solid; border-left-width: 3px; opacity: 1; }
  .months span.triplbl { top: 15px; height: auto; background: var(--tc); color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 3px; transform: translateX(-50%); z-index: 2; pointer-events: auto; cursor: pointer; }
  .row.picked .nm { color: var(--ink); }
  .row .dayb { display: inline-block; font: 9.5px/14px 'DM Mono', monospace; color: #fff; padding: 0 4px; border-radius: 3px; margin-right: 3px; }
  #brush { position: absolute; top: 0; bottom: 0; background: rgba(27,127,91,.14); border-left: 2px solid var(--green); border-right: 2px solid var(--green); display: none; }
  .empty-note { padding: 30px; text-align: center; opacity: .6; font-size: 13px; }
</style>
</head>
<body>
<div id="main">
  <div id="map"></div>
  <div id="divider" title="Drag to resize · double-click to reset"></div>
  <div id="bar"></div>
  <div id="tl"></div>
</div>
<script>
const S = Shell.init({ hint: 'Pan/zoom the map to filter places · drag across the timeline to filter dates · plan several days in the sleigh' });
const REGION_ORDER = ['Southwestern Ontario', 'Huron, Perth, Waterloo & Wellington', 'Bruce, Grey & Simcoe', 'Niagara', 'Greater Toronto Area',
  'York, Durham & Headwaters', 'Kawarthas & Northumberland', 'Southeastern Ontario', 'Ottawa Region', 'Northeastern Ontario'];
const pct = i => i / N * 100;
const first = m => m.spans[0]?.[0] ?? '9';

// build timeline
const tl = document.getElementById('tl');
let groupBy = 'duration', rows = [];
function build() {
  let html = `<div class="inner"><div class="tl-head"><div class="label">${groupBy === 'region' ? 'West → East' : 'Longest → shortest'}</div><div class="months" id="scale">`;
  DAYS.forEach((d, i) => {
    if (d.endsWith('-01')) html += `<span class="mo" style="left:${pct(i)}%">${fmt(d, { month: 'short' }).toUpperCase()}</span>`;
    const wd = isoToDate(d).getDay();
    html += `<span class="dn ${wd === 0 || wd === 6 ? 'we' : ''} ${wd === 1 ? 'wk' : ''}" style="left:${pct(i + .5)}%">${+d.slice(8)}</span>`;
  });
  html += `<span class="hov" id="hov"></span>`;
  html += `<span class="todaylbl" style="left:${pct(DAYS.indexOf(TODAY))}%">TODAY</span></div></div><div class="grid-lines" id="gl">`;
  DAYS.forEach((d, i) => { if (isoToDate(d).getDay() === 6) html += `<div class="wkend" style="left:${pct(i)}%;width:${pct(2)}%"></div>`; });
  html += `<div class="today" style="left:${pct(DAYS.indexOf(TODAY) + .5)}%"></div><div id="brush"></div><div class="hovline" id="hovline"></div></div>`;
  const groups = groupBy === 'region'
    ? REGION_ORDER.map(r => [r, REGION_COLORS[r], '', MARKETS.filter(m => m.region === r)])
    : Object.entries(DURATIONS).map(([k, d]) => [d.label, d.color, d.detail, MARKETS.filter(m => durationKind(m) === k)]);
  groups.forEach(([g, c, detail, list]) => {
    const ms = list.sort((a, b) => first(a) < first(b) ? -1 : 1);
    html += `<div class="reg" data-r="${g}"><i style="background:${c}"></i>${g}${detail ? ` <span style="opacity:.55;text-transform:none">· ${detail} · ${ms.length}</span>` : ''}</div>`;
    ms.forEach(m => {
      const bars = m.tbd ? '<span class="tbd">dates TBA, check site</span>' : m.spans.map(([s, e]) =>
        `<div class="bar ${m.select ? 'select' : ''}" style="background:${col(m)};left:${pct(DAYS.indexOf(s))}%;width:${pct(DAYS.indexOf(e) - DAYS.indexOf(s) + 1)}%"></div>`).join('');
      const links = (m.url ? `<a href="${m.url}" target="_blank" rel="noopener" title="Market website">🌐</a>` : `<span class="nolink" title="The source page gives no link for this market">🌐</span>`)
        + `<a href="${gmapsUrl(m)}" target="_blank" rel="noopener" title="Open ${m.venue} in Google Maps">📍</a>`;
      html += `<div class="row" data-id="${m.id}" data-r="${g}"><div class="name"><span class="nm" title="Add to sleigh">${m.name}<small>${m.city} · ${durationText(m)}</small></span><span class="links">${links}</span></div><div class="track">${bars}</div></div>`;
    });
  });
  tl.innerHTML = html + '<div class="empty-note" id="none" style="display:none">No markets match. Zoom out or change the filters.</div></div>';
  rows = [...tl.querySelectorAll('.row')];
  rows.forEach(r => {
    const m = MARKETS[+r.dataset.id];
    r.querySelector('.nm').onclick = () => S.toggle(m);
    r.onmouseenter = () => S.hl(m, true); r.onmouseleave = () => S.hl(m, false);
    r.classList.toggle('picked', S.isPicked(m));
  });
}
build();
S.onHl.push((m, on) => {
  const r = tl.querySelector(`.row[data-id="${m.id}"]`);
  r.classList.toggle('hl', on);
  if (on && !r.matches(':hover') && r.style.display !== 'none') r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
// show which day(s) each market is planned for, and mark each day's date on the timeline
function drawTrips() {
  rows.forEach(r => {
    const m = MARKETS[+r.dataset.id];
    r.classList.toggle('picked', S.isPicked(m));
    const nm = r.querySelector('.nm');
    nm.querySelectorAll('.dayb').forEach(x => x.remove());
    S.trips.forEach((t, i) => { if (t.stops.includes(m)) nm.insertAdjacentHTML('afterbegin', `<span class="dayb" style="background:${t.color}" title="Planned for Day ${i + 1}">D${i + 1}</span>`); });
  });
  const gl = document.getElementById('gl'), sc = document.getElementById('scale');
  gl.querySelectorAll('.tripmark').forEach(x => x.remove()); sc.querySelectorAll('.triplbl').forEach(x => x.remove());
  S.trips.forEach((t, i) => {
    if (!t.date) return;
    const x = pct(DAYS.indexOf(t.date) + .5);
    gl.insertAdjacentHTML('beforeend', `<div class="tripmark ${t === S.active ? 'on' : ''}" style="--tc:${t.color};left:${x}%"></div>`);
    sc.insertAdjacentHTML('beforeend', `<span class="triplbl" data-i="${i}" style="--tc:${t.color};left:${x}%" title="Day ${i + 1}: ${fmt(t.date)}">D${i + 1}</span>`);
  });
  sc.querySelectorAll('.triplbl').forEach(l => l.onmousedown = e => { e.stopPropagation(); S.activate(S.trips[+l.dataset.i]); });
}
S.onPick.push(drawTrips);
// picking a day jumps the date brush to it, so you see what's open that day
S.onActivate.push(t => { if (t?.date) { const i = DAYS.indexOf(t.date); brush = [i, i]; update(); } });
// a new day starts on the brushed day (if one day is brushed)
S.suggestDate = () => brush && brush[0] === brush[1] ? DAYS[brush[0]] : null;
drawTrips();
S.onFilter.push(() => update());

// --- brushing dates ---
let brush = null; // [i0, i1]
function dayAt(clientX) {
  const rect = document.getElementById('scale').getBoundingClientRect();
  return Math.max(0, Math.min(N - 1, Math.floor((clientX - rect.left) / rect.width * N)));
}
let dragStart = null;
tl.addEventListener('mousedown', e => {
  if (!e.target.closest('.track, .months')) return;
  dragStart = dayAt(e.clientX); brush = [dragStart, dragStart]; update();
});
// hover readout: hairline + exact date under the cursor
tl.addEventListener('mousemove', e => {
  const on = e.target.closest('.track, .months'), hov = document.getElementById('hov'), line = document.getElementById('hovline');
  if (!on) { hov.style.display = line.style.display = 'none'; return; }
  const i = dayAt(e.clientX), x = pct(i + .5) + '%';
  hov.textContent = fmt(DAYS[i], { weekday: 'short', month: 'short', day: 'numeric' });
  hov.style.left = line.style.left = x; hov.style.display = line.style.display = 'block';
});
tl.addEventListener('mouseleave', () => { document.getElementById('hov').style.display = document.getElementById('hovline').style.display = 'none'; });
addEventListener('mousemove', e => { if (dragStart === null) return; const d = dayAt(e.clientX); brush = [Math.min(dragStart, d), Math.max(dragStart, d)]; update(); });
addEventListener('mouseup', () => {
  if (dragStart === null) return;
  dragStart = null;
  // brushing a single day while the current day-trip has no date gives it that date
  if (brush && brush[0] === brush[1] && !S.active.date) { S.active.date = DAYS[brush[0]]; S.draw(); }
});

// --- map view filter + combine ---
function update() {
  const b = S.map.getBounds();
  const inView = new Set(MARKETS.filter(m => b.contains([m.lat, m.lng])).map(m => m.id));
  const inDates = brush ? new Set(MARKETS.filter(m => DAYS.slice(brush[0], brush[1] + 1).some(d => openOn(m, d))).map(m => m.id)) : null;
  rows.forEach(r => {
    const id = +r.dataset.id;
    r.style.display = inView.has(id) && S.passes(MARKETS[id]) ? '' : 'none';
    r.classList.toggle('dim', !!inDates && !inDates.has(id));
  });
  tl.querySelectorAll('.reg').forEach(h => { h.style.display = rows.some(r => r.dataset.r === h.dataset.r && r.style.display !== 'none') ? '' : 'none'; });
  document.getElementById('none').style.display = rows.some(r => r.style.display !== 'none') ? 'none' : '';
  const brushEl = document.getElementById('brush');
  S.dim(inDates);
  if (brush) { brushEl.style.display = 'block'; brushEl.style.left = pct(brush[0]) + '%'; brushEl.style.width = pct(brush[1] - brush[0] + 1) + '%'; }
  else brushEl.style.display = 'none';
  const both = [...inView].filter(id => (!inDates || inDates.has(id)) && S.passes(MARKETS[id])).length;
  const dateTxt = brush ? (brush[0] === brush[1] ? fmt(DAYS[brush[0]], { weekday: 'short', month: 'short', day: 'numeric' })
    : fmt(DAYS[brush[0]], { month: 'short', day: 'numeric' }) + ' – ' + fmt(DAYS[brush[1]], { month: 'short', day: 'numeric' })) : 'any date';
  document.getElementById('bar').innerHTML =
    `<span class="chip ${inView.size < MARKETS.length ? 'on' : ''}">📍 ${inView.size === MARKETS.length ? 'all of Ontario' : inView.size + ' in map view'}</span>
     <span class="chip ${brush ? 'on' : ''}">📅 ${dateTxt}</span>
     <span class="grp">Group by <button data-g="duration" class="${groupBy === 'duration' ? 'on' : ''}">how long</button><button data-g="region" class="${groupBy === 'region' ? 'on' : ''}">region</button></span>
     <b>${both} market${both === 1 ? '' : 's'} match</b>
     ${brush ? '<button id="clrD">clear dates</button>' : ''}
     ${inView.size < MARKETS.length ? '<button id="clrM">show all of Ontario</button>' : ''}`;
  document.querySelectorAll('.grp button').forEach(b => b.onclick = () => { groupBy = b.dataset.g; build(); drawTrips(); update(); });
  document.getElementById('clrD')?.addEventListener('click', () => { brush = null; update(); });
  document.getElementById('clrM')?.addEventListener('click', () => S.map.fitBounds(L.latLngBounds(MARKETS.map(m => [m.lat, m.lng])), { padding: [20, 20] }));
}
S.map.on('moveend', update);

// --- draggable divider between map and timeline ---
(() => {
  const main = document.getElementById('main'), div = document.getElementById('divider');
  const MIN_MAP = 120, MIN_TL = 150;
  const setH = h => {
    const max = main.clientHeight - 12 - 34 - MIN_TL;
    h = Math.max(MIN_MAP, Math.min(max, h));
    main.style.setProperty('--maph', h + 'px');
    return h;
  };
  let raf = 0;
  const refreshMap = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => S.map.invalidateSize({ pan: false })); };
  const saved = +localStorage.getItem('c2-map-height');
  if (saved) { setH(saved); refreshMap(); }
  div.addEventListener('pointerdown', e => {
    e.preventDefault();
    div.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    const top = main.getBoundingClientRect().top;
    const move = ev => { setH(ev.clientY - top - 6); refreshMap(); };
    const up = () => {
      div.removeEventListener('pointermove', move); div.removeEventListener('pointerup', up);
      document.body.classList.remove('resizing');
      localStorage.setItem('c2-map-height', parseInt(getComputedStyle(main).getPropertyValue('--maph')) || '');
      update(); // map view changed size, refresh "in map view" filter
    };
    div.addEventListener('pointermove', move); div.addEventListener('pointerup', up);
  });
  div.addEventListener('dblclick', () => { main.style.removeProperty('--maph'); localStorage.removeItem('c2-map-height'); refreshMap(); setTimeout(update, 50); });
  addEventListener('resize', () => { const cur = parseInt(main.style.getPropertyValue('--maph')); if (cur) setH(cur); refreshMap(); });
})();
update();
if (S.active.date) S.onActivate.forEach(f => f(S.active)); // shared link with a dated day: start on it
</script>
</body>
</html>
