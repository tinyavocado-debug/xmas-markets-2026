<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleigh Route · Ontario holiday markets</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root { --bg: #fbf6ee; --ink: #1d2a24; --red: #d7263d; --green: #1b7f5b; --line: #e6dccb; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 56px 44vh 1fr; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-bottom: 3px solid var(--ink);
    background: repeating-linear-gradient(-45deg, var(--red) 0 14px, #fff 14px 28px); }
  header h1 { margin: 0; font-size: 22px; background: var(--ink); color: #fff; padding: 4px 12px; border-radius: 6px; letter-spacing: .5px; }
  header .hint { background: #fff; padding: 4px 10px; border-radius: 6px; font-size: 13px; border: 2px solid var(--ink); }
  #map { grid-column: 1; grid-row: 2; border-bottom: 3px solid var(--ink); }
  #ticket { grid-column: 2; grid-row: 2 / 4; border-left: 3px solid var(--ink); display: flex; flex-direction: column; background: #fff; }

  /* calendar */
  #cal { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .month { display: flex; flex-direction: column; padding: 10px 14px 12px; min-height: 0; }
  .mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mhead h3 { margin: 0; font-size: 20px; min-width: 170px; }
  .mhead button { border: 2px solid var(--ink); background: #fff; border-radius: 6px; width: 30px; height: 28px; cursor: pointer; font-size: 15px; }
  .mhead button:disabled { opacity: .25; cursor: default; }
  .mhead .tip { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 11px; opacity: .6; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 4px; min-height: 0; }
  .dow { font-family: 'DM Mono', monospace; font-size: 10.5px; text-transform: uppercase; opacity: .55; text-align: left; padding-left: 4px; align-self: end; }
  .day { background: #fff; border: 1.5px solid var(--line); border-radius: 7px; padding: 3px 5px; cursor: pointer; position: relative; overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
  .day.out { background: transparent; border-color: transparent; cursor: default; }
  .day:not(.out):hover { border-color: var(--ink); }
  .day.sel { border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .day.today .n::after { content: 'TODAY'; margin-left: 5px; font: 8.5px 'DM Mono', monospace; background: var(--red); color: #fff; padding: 1px 3px; border-radius: 3px; vertical-align: 2px; }
  .day.xmas .n::after { content: '★'; color: var(--green); margin-left: 4px; }
  .day .n { font-weight: 700; font-size: 13px; display: flex; align-items: baseline; }
  .day .n small { margin-left: auto; font: 10px 'DM Mono', monospace; opacity: .55; font-weight: 400; }
  .dots { display: flex; flex-wrap: wrap; gap: 2px; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; transition: transform .12s, opacity .12s; }
  .cdot.maybe { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.75) 0 1.5px, transparent 1.5px 3px) !important; }
  .cdot.pk { box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--red); }
  #cal.focus .cdot { opacity: .15; }
  #cal.focus .cdot.hl { opacity: 1; transform: scale(1.6); }
  .aboard { position: absolute; right: 4px; bottom: 3px; font: 9.5px 'DM Mono', monospace; padding: 1px 4px; border-radius: 3px; background: #eee; }
  .aboard.all { background: var(--green); color: #fff; }

  #daylist { border-left: 2px solid var(--ink); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  #daylist h4 { margin: 0; padding: 12px 14px 8px; font-size: 15px; border-bottom: 1px solid var(--line); }
  #daylist h4 small { display: block; font: 11px 'DM Mono', monospace; opacity: .6; font-weight: 400; margin-top: 2px; }
  #dl { overflow-y: auto; flex: 1; }
  .dm { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 12.5px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .dm:hover, .dm.hl { background: #fff1d6; }
  .dm i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dm span { flex: 1; min-width: 0; }
  .dm small { display: block; font: 10.5px 'DM Mono', monospace; opacity: .6; }
  .dm b { font: 11px 'DM Mono', monospace; border: 1.5px solid var(--ink); border-radius: 5px; padding: 1px 6px; background: #fff; white-space: nowrap; }
  .dm.pk b { background: var(--red); color: #fff; border-color: var(--red); }
  .dm.note { cursor: default; font: 10.5px 'DM Mono', monospace; opacity: .6; display: block; line-height: 1.4; }

  /* ticket */
  #ticket .stub { padding: 18px 18px 12px; border-bottom: 2px dashed var(--ink); }
  #ticket h2 { margin: 0; font-size: 20px; }
  #ticket .km { font-family: 'DM Mono', monospace; font-size: 12px; margin-top: 6px; }
  #ticket .km b { font-size: 22px; color: var(--red); }
  #stops { list-style: none; margin: 0; padding: 8px 0; overflow-y: auto; flex: 1; counter-reset: s; }
  #stops li { padding: 9px 18px 9px 48px; position: relative; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  #stops li::before { counter-increment: s; content: counter(s); position: absolute; left: 14px; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font: 12px/22px 'DM Mono', monospace; text-align: center; }
  #stops li small { display: block; font-family: 'DM Mono', monospace; font-size: 11px; opacity: .65; margin-top: 2px; }
  #stops li button { position: absolute; right: 12px; top: 10px; border: 0; background: none; cursor: pointer; font-size: 14px; opacity: .5; }
  #stops .empty { padding: 30px 22px; opacity: .6; font-size: 13.5px; line-height: 1.5; }
  #stops .empty::before { display: none; }
  .legend { padding: 12px 18px; border-top: 2px solid var(--ink); font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .15s; }
  .dot.hl { transform: scale(1.7); }
  .dot.picked { background: var(--red) !important; color: #fff; font: 10px/14px 'DM Mono', monospace; text-align: center; width: 18px; height: 18px; line-height: 18px; margin: -2px; }
  .sleigh { font-size: 30px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); transform: scaleX(-1); }
  .leaflet-tooltip { font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body>
<header>
  <h1>🛷 Sleigh Route</h1>
  <span class="hint">Pick a day, then load markets onto your sleigh (or click pins on the map)</span>
</header>
<div id="map"></div>
<div id="cal">
  <div class="month">
    <div class="mhead"><button id="prev">‹</button><h3 id="mtitle"></h3><button id="next">›</button>
      <span class="tip">hover a pin to see its days · striped = select dates</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="daylist"><h4 id="dlh"></h4><div id="dl"></div></div>
</div>
<aside id="ticket">
  <div class="stub">
    <h2>Your sleigh</h2>
    <div class="km" id="km"></div>
  </div>
  <ul id="stops"></ul>
  <div class="legend" id="legend"></div>
</aside>

<script>
const DAYS = seasonDays(), N = DAYS.length, TODAY = todayIso();
const REGION_COLORS = {
  'Greater Toronto Area': '#d7263d', 'Ottawa Region': '#7b3fa0', 'York, Durham & Headwaters': '#1b7f5b',
  'Huron, Perth, Waterloo & Wellington': '#e08a00', 'Bruce, Grey & Simcoe': '#2a6fdb', 'Southwestern Ontario': '#8c5a2b',
  'Southeastern Ontario': '#0f9fa8', 'Kawarthas & Northumberland': '#c2477a', 'Niagara': '#6a8f1f', 'Northeastern Ontario': '#33415c'
};
const col = m => REGION_COLORS[m.region];
const picked = [];

const map = L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors', maxZoom: 16 }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, pane: 'overlayPane' }).addTo(map);
// fit to southern Ontario; the two northern markets sit just off the top (pan up to see them)
map.fitBounds(L.latLngBounds(MARKETS.filter(m => m.lat < 46).map(m => [m.lat, m.lng])), { padding: [20, 20] });
const route = L.polyline([], { color: '#d7263d', weight: 3, dashArray: '8 8' }).addTo(map);
const sleigh = L.marker([0, 0], { icon: L.divIcon({ className: '', html: '<div class="sleigh">🛷</div>', iconSize: [30, 30], iconAnchor: [-4, 30] }), interactive: false });

const markers = MARKETS.map(m => {
  const mk = L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', html: `<div class="dot" style="background:${col(m)}"></div>`, iconSize: [14, 14] }) }).addTo(map);
  mk.bindTooltip(`<b>${m.name}</b><br>${m.city} · ${m.when}`, { direction: 'top', offset: [0, -8] });
  mk.on('click', () => toggle(m));
  mk.on('mouseover', () => hl(m, true)); mk.on('mouseout', () => hl(m, false));
  return mk;
});

// calendar
const calEl = document.getElementById('cal');
const MONTHS = [...new Set(DAYS.map(d => d.slice(0, 7)))];
let monthIdx = MONTHS.indexOf(TODAY.slice(0, 7)), selDay = TODAY;
const onDay = d => MARKETS.map(m => [m, dayStatus(m, d)]).filter(([, st]) => st === 'open' || st === 'maybe');

function renderMonth() {
  const ym = MONTHS[monthIdx], days = DAYS.filter(d => d.startsWith(ym));
  document.getElementById('mtitle').textContent = fmt(days[0], { month: 'long', year: 'numeric' });
  document.getElementById('prev').disabled = monthIdx === 0;
  document.getElementById('next').disabled = monthIdx === MONTHS.length - 1;
  const g = document.getElementById('grid');
  g.innerHTML = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="dow">${x}</div>`).join('');
  const first = isoToDate(ym + '-01'), lead = (first.getDay() + 6) % 7;
  const dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const weeks = Math.ceil((lead + dim) / 7);
  g.style.gridTemplateRows = `auto repeat(${weeks}, 1fr)`;
  for (let i = 0; i < weeks * 7; i++) {
    const dn = i - lead + 1, iso = ym + '-' + String(dn).padStart(2, '0');
    const cell = document.createElement('div');
    if (dn < 1 || dn > dim || !days.includes(iso)) { cell.className = 'day out'; g.appendChild(cell); continue; }
    const list = onDay(iso);
    cell.className = 'day' + (iso === TODAY ? ' today' : '') + (iso === '2026-12-25' ? ' xmas' : '') + (iso === selDay ? ' sel' : '');
    cell.dataset.d = iso;
    cell.innerHTML = `<div class="n">${dn}<small>${list.length || ''}</small></div><div class="dots">${
      list.map(([m, st]) => `<i class="cdot ${st}" data-id="${m.id}" style="background-color:${col(m)}"></i>`).join('')}</div>`;
    cell.onclick = () => { selDay = iso; renderMonth(); renderDay(); };
    g.appendChild(cell);
  }
  markPicked();
}
document.getElementById('prev').onclick = () => { monthIdx--; renderMonth(); };
document.getElementById('next').onclick = () => { monthIdx++; renderMonth(); };

function renderDay() {
  const list = onDay(selDay).sort((a, b) => (a[1] === b[1] ? 0 : a[1] === 'open' ? -1 : 1));
  document.getElementById('dlh').innerHTML = `${fmt(selDay)}<small>${list.length} market${list.length === 1 ? '' : 's'} on${list.some(x => x[1] === 'maybe') ? ' (incl. select-dates)' : ''}</small>`;
  const dl = document.getElementById('dl');
  dl.innerHTML = list.length ? '' : '<div class="dm note">Nothing on this day.</div>';
  list.forEach(([m, st]) => {
    const r = document.createElement('div');
    r.className = 'dm'; r.dataset.id = m.id;
    r.innerHTML = `<i style="background:${col(m)}"></i><span>${m.name}<small>${m.city}${st === 'maybe' ? ' · select dates, check site' : ''}</small></span><b></b>`;
    r.onclick = () => toggle(m);
    r.onmouseenter = () => hl(m, true); r.onmouseleave = () => hl(m, false);
    dl.appendChild(r);
  });
  const tbd = MARKETS.filter(m => m.tbd);
  if (tbd.length) dl.insertAdjacentHTML('beforeend', `<div class="dm note">Not on the calendar, dates TBA: ${tbd.map(m => m.name).join(', ')}</div>`);
  // fade pins not on this day
  const ids = new Set(list.map(([m]) => m.id));
  MARKETS.forEach(m => { markers[m.id].getElement().style.opacity = ids.has(m.id) || picked.includes(m) ? 1 : .3; });
  markPicked();
}

function markPicked() {
  document.querySelectorAll('.cdot').forEach(d => d.classList.toggle('pk', picked.some(m => m.id === +d.dataset.id)));
  document.querySelectorAll('.dm[data-id]').forEach(r => {
    const on = picked.some(m => m.id === +r.dataset.id);
    r.classList.toggle('pk', on); r.querySelector('b').textContent = on ? '✓ on sleigh' : '+ sleigh';
  });
  document.querySelectorAll('.day[data-d]').forEach(c => {
    c.querySelector('.aboard')?.remove();
    if (picked.length < 2) return;
    const n = picked.filter(m => ['open', 'maybe'].includes(dayStatus(m, c.dataset.d))).length;
    if (n) c.insertAdjacentHTML('beforeend', `<span class="aboard ${n === picked.length ? 'all' : ''}">${n === picked.length ? 'all aboard' : n + '/' + picked.length}</span>`);
  });
}

function hl(m, on) {
  markers[m.id].getElement().firstChild.classList.toggle('hl', on);
  calEl.classList.toggle('focus', on);
  document.querySelectorAll(`.cdot[data-id="${m.id}"]`).forEach(d => d.classList.toggle('hl', on));
  document.querySelector(`.dm[data-id="${m.id}"]`)?.classList.toggle('hl', on);
}

function toggle(m) {
  const i = picked.indexOf(m);
  i >= 0 ? picked.splice(i, 1) : picked.push(m);
  draw();
}

function draw() {
  MARKETS.forEach(m => {
    const el = markers[m.id].getElement().firstChild, k = picked.indexOf(m);
    el.classList.toggle('picked', k >= 0); el.textContent = k >= 0 ? k + 1 : '';
    markers[m.id].setZIndexOffset(k >= 0 ? 1000 : 0);
  });
  route.setLatLngs(picked.map(m => [m.lat, m.lng]));
  renderDay();
  if (picked.length) sleigh.setLatLng([picked.at(-1).lat, picked.at(-1).lng]).addTo(map); else sleigh.remove();
  let km = 0; for (let i = 1; i < picked.length; i++) km += haversineKm(picked[i - 1], picked[i]);
  document.getElementById('km').innerHTML = picked.length > 1
    ? `<b>${Math.round(km)} km</b> as the reindeer flies · ${picked.length} stops`
    : picked.length ? '1 stop loaded. Add another.' : 'Empty. The reindeer are waiting.';
  const ul = document.getElementById('stops');
  ul.innerHTML = picked.length ? '' : '<li class="empty">Pick a day on the calendar and add markets, or click pins on the map. Once you have 2+ stops, the calendar marks the days when they are all open.</li>';
  picked.forEach(m => {
    const li = document.createElement('li');
    li.innerHTML = `${m.name}<small>${m.city} · ${m.when}</small><button title="Remove">✕</button>`;
    li.querySelector('button').onclick = () => toggle(m);
    li.onmouseenter = () => hl(m, true); li.onmouseleave = () => hl(m, false);
    ul.appendChild(li);
  });
}
renderMonth();
draw();

document.getElementById('legend').innerHTML = Object.entries(REGION_COLORS).map(([r, c]) => `<span><i style="background:${c}"></i>${r}</span>`).join('')
  + '<span><i style="background:repeating-linear-gradient(45deg,#999 0 2px,#fff 2px 4px)"></i>select dates</span>';
</script>
</body>
</html>
