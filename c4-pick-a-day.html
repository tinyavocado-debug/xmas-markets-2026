<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sleigh Route · Pick a Day</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c-shell.css">
<script src="data.js"></script>
<script src="c-shell.js"></script>
<style>
  body { grid-template-columns: 1fr 360px; }
  #main, #map { height: 100%; }
  .legend { display: none; } /* the map's "How long?" box and the list's colours do this job */
  /* no day cards: the calendar picks the day, the itinerary lives under it */
  #trips { display: none; }

  /* small calendar: click a date to list what's open */
  .mcal { padding: 8px 12px 6px; background: #fff; border-bottom: 1px solid var(--line); }
  .mcal .mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; font-size: 13px; }
  .mcal .mh button { border: 0; background: none; cursor: pointer; font-size: 15px; padding: 0 8px; color: var(--ink); }
  .mcal .mh button:disabled { opacity: .2; cursor: default; }
  .mcal .mg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .mcal .wd { font: 9.5px 'DM Mono', monospace; text-align: center; opacity: .5; }
  .mcal .c { font: 11px 'DM Mono', monospace; border: 0; background: none; border-radius: 5px; cursor: pointer; padding: 0; position: relative; height: 22px; color: var(--ink); }
  .mcal .c:hover { background: #fff1d6; }
  .mcal .c.out { opacity: .2; pointer-events: none; }
  .mcal .c.today { box-shadow: inset 0 0 0 1.5px var(--red); }
  .mcal .c.sel { background: var(--ink); color: #fff; }
  .mcal .c i { position: absolute; left: 28%; right: 28%; bottom: 2px; height: 3px; border-radius: 2px; background: var(--tc); }

  #daylist { flex: 1 1 0; min-height: 0; overflow-y: auto; }
  .dl-head { padding: 9px 14px 9px; cursor: pointer; user-select: none; background: var(--bg); position: sticky; top: 0; z-index: 3; border-top: 2px solid var(--ink); }
  .dl-head:hover { background: #fff1d6; }
  .dl-head .t { display: flex; align-items: baseline; gap: 6px; font-size: 14px; }
  .dl-head .t .car { font-size: 11px; width: 12px; display: inline-block; transition: transform .15s; }
  #daylist:not(.shut) .car { transform: rotate(90deg); }
  .dl-head .t b { flex: 1; }
  .dl-head .t .n { font: 11px 'DM Mono', monospace; opacity: .7; }
  .dl-head .note { font: 10.5px 'DM Mono', monospace; opacity: .65; margin: 3px 0 0 18px; }
  .sum { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0 18px; font-size: 11.5px; }
  .sum .k { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 11px; background: #fff; border: 1.5px solid var(--line); }
  .sum .k i { width: 8px; height: 8px; border-radius: 50%; }
  .sum .k.zero { opacity: .4; }
  .dl-body { border-top: 1px solid var(--line); }

  /* itinerary for the picked day */
  .itwrap { padding: 2px 10px 12px; background: #fff; }
  .mkitin { width: 100%; border: 2px dashed var(--ink); background: none; border-radius: 9px; padding: 9px; font: 600 13px 'Space Grotesk', sans-serif; cursor: pointer; color: var(--ink); }
  .mkitin:hover { background: #fff1d6; }
  .itin { border: 2px solid var(--tc); border-left-width: 6px; border-radius: 9px; box-shadow: 3px 3px 0 var(--tc); background: #fff; }
  .itin .ih { display: flex; align-items: baseline; gap: 6px; padding: 7px 8px 5px 10px; }
  .itin .ih b { flex: 1; font-size: 13.5px; }
  .itin .ih span { font: 10.5px 'DM Mono', monospace; opacity: .65; }
  .itin .ih button { border: 0; background: none; cursor: pointer; opacity: .45; font-size: 12px; }
  .itin .ih button:hover { opacity: 1; }
  .itin .ie { padding: 2px 10px 10px; font-size: 12px; opacity: .65; }
  .itin .foot { display: flex; justify-content: space-between; align-items: center; padding: 0 10px 8px; font: 10.5px 'DM Mono', monospace; }
  .itin .foot span { opacity: .6; }
  .itin .foot button { border: 0; background: none; cursor: pointer; font: inherit; color: var(--tc); padding: 0; }
  .itin .foot button:hover { text-decoration: underline; }
  .flash { background: #fbe7c0; color: #7a4b00; font: 11px 'DM Mono', monospace; padding: 5px 8px; border-radius: 6px; margin-bottom: 8px; }
  .flash button { font: inherit; border: 1.5px solid #7a4b00; background: #fff; color: #7a4b00; border-radius: 4px; cursor: pointer; margin-top: 4px; }
  .row .pk { margin: 0 4px 0 0; accent-color: var(--ac); cursor: pointer; flex: none; }
  #daylist.shut .dl-body { display: none; }

  details.grp > summary { list-style: none; cursor: pointer; padding: 7px 12px 5px 10px; border-left: 5px solid var(--gc); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; user-select: none; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary:hover { background: #fff1d6; }
  details.grp > summary::before { content: '▶'; font-size: 8px; width: 10px; display: inline-block; transition: transform .15s; }
  details.grp[open] > summary::before { transform: rotate(90deg); }
  details.grp summary b { font-size: 13px; }
  details.grp summary .c { font: 11px 'DM Mono', monospace; opacity: .6; }
  details.grp summary .says { flex-basis: 100%; font-size: 11px; opacity: .7; padding-left: 14px; }
  details.grp.closed summary { border-left-color: var(--line); opacity: .75; }

  .row { padding: 5px 10px 5px 20px; border-top: 1px solid var(--line); font-size: 12.5px; position: relative; }
  .row.hl { background: #fff1d6; }
  .row .l1 { display: flex; align-items: center; gap: 4px; }
  .row .nm { flex: 1; min-width: 0; cursor: pointer; }
  .row .nm:hover { text-decoration: underline; }
  .row.picked .nm { color: var(--ac); font-weight: 600; }
  .row .l2 { font: 10.5px 'DM Mono', monospace; opacity: .75; margin-top: 1px; }
  .row .l2 .then { opacity: .7; }
  .tag { font: 9.5px 'DM Mono', monospace; padding: 0 5px; border-radius: 3px; margin-left: 4px; white-space: nowrap; }
  .tag.last { background: var(--red); color: #fff; }
  .tag.maybe { background: #fbe7c0; color: #7a4b00; }
  .links { display: flex; gap: 1px; flex: none; }
  .links a, .links span { text-decoration: none; font-size: 11.5px; width: 20px; height: 19px; display: grid; place-items: center; border-radius: 5px; }
  .links a:hover { background: #fff; box-shadow: 0 0 0 1.5px var(--ink); }
  .links .nolink { opacity: .2; cursor: help; }
  .dayb { display: inline-block; font: 9px/13px 'DM Mono', monospace; color: #fff; padding: 0 3px; border-radius: 3px; margin-right: 3px; vertical-align: 1px; }
  .closed .row { opacity: .6; }
  .empty-note { padding: 16px 14px; opacity: .6; font-size: 12.5px; }
</style>
</head>
<body>
<div id="main">
  <div id="map"></div>
</div>
<script>
const S = Shell.init({ hint: 'Pick a date to see what’s open · create an itinerary and tick the markets you want to visit' });
const KINDS = ['long', 'mid', 'short', 'weekly', 'tbd'];
// what each kind means for the person picking a day
const KIND_SAYS = {
  long: 'open for weeks: no rush, most other days work too',
  mid: 'a limited stretch of 5–20 days',
  short: 'only 1–4 days at a time: go now or catch the next run',
  weekly: 'one day at a time, repeating',
  tbd: 'no dates published: check the site',
};
const short = d => fmt(d, { month: 'short', day: 'numeric' });
const range = (s, e) => s === e ? short(s) : s.slice(5, 7) === e.slice(5, 7) ? `${short(s)}–${+e.slice(8)}` : `${short(s)} – ${short(e)}`;
const WD = ['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'];

// collapsed state survives reloads
const UI_KEY = 'xmas-markets-2026:list';
const ui = (() => { try { return { shut: false, groups: {}, ...JSON.parse(localStorage.getItem(UI_KEY)) }; } catch { return { shut: false, groups: {} }; } })();
const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch { } };
const groupOpen = k => ui.groups[k] ?? k !== 'closed';

const day = d => fmt(d, { weekday: 'short', month: 'short', day: 'numeric' });
const tripOn = d => S.trips.find(t => t.date === d) || null;

// ---- tidy up plans saved by the older day-card version ----
S.trips.filter(t => !t.stops.length && !t.date).forEach(t => S.trips.splice(S.trips.indexOf(t), 1)); // empty + undated: nothing to keep
S.trips.filter(t => t.date).forEach(t => { // two plans on one date → one itinerary
  const keep = tripOn(t.date);
  if (keep !== t) { t.stops.forEach(m => keep.stops.includes(m) || keep.stops.push(m)); S.trips.splice(S.trips.indexOf(t), 1); }
});
const undated = () => S.trips.filter(t => !t.date); // shown in the panel so they can be given a date, never dropped quietly

// the date being looked at; S.active is always that date's itinerary (or none)
const start = DAYS.includes(TODAY) ? TODAY : DAYS[0];
let sel = tripOn(start) ? start : (S.trips.map(t => t.date).filter(d => d && d >= start).sort()[0] || start);
let viewMo = sel.slice(0, 7);
const MONTHS = [...new Set(DAYS.map(d => d.slice(0, 7)))];
function pick(d) {
  sel = d; viewMo = d.slice(0, 7); msg = '';
  S.active = tripOn(d);
  S.draw(); // redraws pins + saves, then render()
}
function calHtml() {
  const mi = MONTHS.indexOf(viewMo), first = isoToDate(viewMo + '-01');
  const daysIn = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let g = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span class="wd">${x}</span>`).join('') + '<span></span>'.repeat(first.getDay());
  for (let n = 1; n <= daysIn; n++) {
    const d = `${viewMo}-${String(n).padStart(2, '0')}`, t = tripOn(d);
    g += `<button class="c ${DAYS.includes(d) ? '' : 'out'} ${d === sel ? 'sel' : ''} ${d === TODAY ? 'today' : ''}" data-d="${d}" title="${fmt(d)}${t ? ` · itinerary, ${t.stops.length} stop${t.stops.length === 1 ? '' : 's'}` : ''}">${n}${t ? `<i style="--tc:${t.color}"></i>` : ''}</button>`;
  }
  return `<div class="mcal"><div class="mh"><button data-m="-1" ${mi > 0 ? '' : 'disabled'}>‹</button><b>${fmt(viewMo + '-01', { month: 'long', year: 'numeric' })}</b><button data-m="1" ${mi < MONTHS.length - 1 ? '' : 'disabled'}>›</button></div><div class="mg">${g}</div></div>`;
}

// ---- itinerary ----
let msg = '', msgTimer = 0;
function flash(text) { msg = text; render(); clearTimeout(msgTimer); msgTimer = setTimeout(() => { msg = ''; render(); }, 5000); }
function itinHtml() {
  let h = '<div class="itwrap">';
  undated().forEach((t, i) => h += `<div class="flash">A saved itinerary has no date (${t.stops.map(m => m.name).join(', ')}).<br><button data-orphan="${S.trips.indexOf(t)}">Put it on ${day(sel)}</button></div>`);
  if (msg) h += `<div class="flash">${msg}</div>`;
  const t = S.active;
  if (!t) return h + `<button class="mkitin" id="mk">＋ Create itinerary for ${day(sel)}</button></div>`;
  const km = S.tripKm(t);
  h += `<div class="itin" style="--tc:${t.color}"><div class="ih"><b>Itinerary · ${day(sel)}</b><span>${t.stops.length} stop${t.stops.length === 1 ? '' : 's'}${km ? ` · ${Math.round(km)} km` : ''}</span><button id="del" title="Delete this itinerary">✕</button></div>`;
  if (!t.stops.length) h += `<div class="ie">Tick the markets you want to visit in the list below (or click their pins).</div>`;
  else {
    h += `<ol class="tstops">${t.stops.map(m => `<li data-id="${m.id}">${m.name}<small>${m.city}</small>${openOn(m, sel) ? '' : `<span class="warn">⚠ not open ${day(sel)}</span>`}<span class="lnk">${m.url ? `<a href="${m.url}" target="_blank" rel="noopener">🌐 market website</a>` : '<span title="The source page gives no link">no website listed</span>'}</span><button class="rm" data-id="${m.id}" title="Remove">✕</button></li>`).join('')}</ol>`;
    h += `<a class="groute" target="_blank" rel="noopener" href="${t.stops.length === 1 ? gmapsUrl(t.stops[0]) : routeUrl(t.stops.slice(0, 11))}">${t.stops.length === 1 ? '📍 Open in Google Maps' : t.stops.length > 11 ? '🚗 Route in Google Maps (first 11 stops; Google’s limit)' : '🚗 Route in Google Maps'}</a>`;
  }
  return h + `<div class="foot"><span>Saved in this browser</span><button id="copy">🔗 copy share link</button></div></div></div>`;
}
// any add (tick, name, map pin) goes to the picked day's itinerary; closed markets can't be added
const addOrRemove = S.toggle.bind(S);
S.toggle = m => {
  if (!S.active?.stops.includes(m) && !openOn(m, sel)) { flash(`${m.name} isn't open ${day(sel)} (${nextOpen(m, sel)}).`); return; }
  if (!S.active) S.active = S.newTrip(sel);
  addOrRemove(m);
};

// ---- how a market's dates read from the chosen day ----
function info(m, d) {
  const k = durationKind(m);
  const i = m.spans.findIndex(([s, e]) => d >= s && d <= e);
  let end = m.spans[i][1], j = i + 1;
  if (k === 'long') while (j < m.spans.length && spanLen([end, m.spans[j][0]]) - 2 <= 2) end = m.spans[j++][1]; // bridge short closures
  const later = m.spans.slice(j);
  const last = d === end && !later.length;
  let now, then = '';
  if (k === 'weekly') {
    const wds = new Set(m.spans.map(([s]) => isoToDate(s).getDay()));
    now = wds.size === 1 ? WD[[...wds][0]] : 'single days';
    if (later.length) then = 'next ' + short(later[0][0]);
  } else if (k === 'long') {
    now = `until ${short(end)}`;
    if (m.spans.length > 1) now += ' · closed some days';
    if (later.length) then = 'then ' + range(...later[0]);
  } else {
    now = m.spans[i][0] === m.spans[i][1] ? 'this day only' : range(...m.spans[i]);
    if (later.length) then = 'then ' + range(...later[0]) + (later.length > 1 ? ` +${later.length - 1} more` : '');
  }
  return { now, then, last };
}
function nextOpen(m, d) {
  if (m.tbd) return 'dates TBA';
  const nx = m.spans.find(([, e]) => e > d);
  return nx ? 'next open ' + short(nx[0]) : `ended ${short(m.spans.at(-1)[1])}`;
}

// ---- the day's list, inside the sleigh panel ----
const box = document.createElement('section');
box.id = 'daylist';
document.getElementById('trips').after(box);

function row(m, l2) {
  const links = (m.url ? `<a href="${m.url}" target="_blank" rel="noopener" title="Market website">🌐</a>` : `<span class="nolink" title="The source page gives no link for this market">🌐</span>`)
    + `<a href="${gmapsUrl(m)}" target="_blank" rel="noopener" title="Open ${m.venue} in Google Maps">📍</a>`;
  const A = S.active, on = A?.stops.includes(m);
  const badges = S.trips.map(t => t !== A && t.stops.includes(m) ? `<span class="dayb" style="background:${t.color}" title="In your ${t.date ? day(t.date) : 'undated'} itinerary">${t.date ? short(t.date) : '?'}</span>` : '').join('');
  const tick = A && (on || openOn(m, sel)) ? `<input type="checkbox" class="pk" ${on ? 'checked' : ''} title="${on ? 'Remove from' : 'Add to'} this day's itinerary">` : '';
  return `<div class="row ${on ? 'picked' : ''}" data-id="${m.id}" style="--ac:${A ? A.color : 'var(--red)'}"><div class="l1">${tick}<span class="nm" title="${on ? 'Remove from' : 'Add to'} the ${day(sel)} itinerary">${badges}${m.name}</span><span class="links">${links}</span></div><div class="l2">${m.city} · ${l2}</div></div>`;
}
function group(key, label, color, says, rows) {
  return `<details class="grp ${key === 'closed' ? 'closed' : ''}" data-k="${key}" style="--gc:${color}" ${groupOpen(key) ? 'open' : ''}>
    <summary><b>${label}</b><span class="c">${rows.length}</span>${says ? `<span class="says">${says}</span>` : ''}</summary>${rows.join('')}</details>`;
}
function render() {
  const d = sel;
  const open = MARKETS.filter(m => S.passes(m) && openOn(m, d));
  const by = k => open.filter(m => durationKind(m) === k).sort((a, b) => a.name < b.name ? -1 : 1);
  let html = calHtml() + itinHtml() + `<div class="dl-head"><div class="t"><span class="car">▶</span><b>Open ${day(d)}</b><span class="n">${open.length} markets</span></div>
    <div class="sum">${KINDS.filter(k => k !== 'tbd' || by('tbd').length).map(k => `<span class="k ${by(k).length ? '' : 'zero'}"><i style="background:${DURATIONS[k].color}"></i>${by(k).length} ${DURATIONS[k].label.toLowerCase()}</span>`).join('')}</div>
    ${S.kind ? `<div class="note">Showing ${DURATIONS[S.kind].label} only (map filter)</div>` : ''}</div><div class="dl-body">`;
  KINDS.forEach(k => {
    const list = by(k);
    if (!list.length) return;
    html += group(k, DURATIONS[k].label, DURATIONS[k].color, KIND_SAYS[k], list.map(m => {
      const f = info(m, d);
      return row(m, `${f.now}${f.then ? ` <span class="then">· ${f.then}</span>` : ''}${f.last ? '<span class="tag last">last chance</span>' : ''}${m.select ? '<span class="tag maybe">select dates: check site</span>' : ''}`);
    }));
  });
  if (!open.length) html += `<div class="empty-note">Nothing open${S.kind ? ' that matches the map filter' : ''} on this day.</div>`;
  const closed = MARKETS.filter(m => S.passes(m) && !openOn(m, d));
  if (closed.length) html += group('closed', 'Not open this day', '', '', closed.map(m => row(m, nextOpen(m, d))));
  const top = box.scrollTop;
  box.innerHTML = html + '</div>';
  box.classList.toggle('shut', ui.shut);
  box.scrollTop = top;
  document.getElementById('mk')?.addEventListener('click', () => { S.active = S.newTrip(sel); S.draw(); });
  document.getElementById('del')?.addEventListener('click', () => {
    const t = S.active;
    if (t.stops.length && !confirm(`Delete the ${day(sel)} itinerary and its ${t.stops.length} stop(s)?`)) return;
    S.trips.splice(S.trips.indexOf(t), 1); S.active = null; S.draw();
  });
  document.getElementById('copy')?.addEventListener('click', e => navigator.clipboard.writeText(location.href).then(() => e.target.textContent = '✓ link copied', () => e.target.textContent = 'copy failed: use the address bar'));
  box.querySelectorAll('.tstops .rm').forEach(b => b.onclick = () => { const t = S.active; t.stops.splice(t.stops.indexOf(MARKETS[+b.dataset.id]), 1); S.draw(); });
  box.querySelectorAll('.tstops li').forEach(li => { const m = MARKETS[+li.dataset.id]; li.onmouseenter = () => S.hl(m, true); li.onmouseleave = () => S.hl(m, false); });
  box.querySelectorAll('[data-orphan]').forEach(b => b.onclick = () => {
    const t = S.trips[+b.dataset.orphan], here = S.active;
    if (here) { t.stops.forEach(m => here.stops.includes(m) || here.stops.push(m)); S.trips.splice(S.trips.indexOf(t), 1); }
    else { t.date = sel; S.active = t; }
    S.draw();
  });

  box.querySelectorAll('.mcal .c[data-d]').forEach(c => c.onclick = () => pick(c.dataset.d));
  box.querySelectorAll('.mcal [data-m]').forEach(b => b.onclick = () => { viewMo = MONTHS[MONTHS.indexOf(viewMo) + +b.dataset.m]; render(); });
  box.querySelector('.dl-head').onclick = () => { ui.shut = !ui.shut; saveUi(); box.classList.toggle('shut', ui.shut); };
  box.querySelectorAll('details.grp').forEach(g => g.ontoggle = () => { ui.groups[g.dataset.k] = g.open; saveUi(); });
  box.querySelectorAll('.row').forEach(r => {
    const m = MARKETS[+r.dataset.id];
    r.querySelector('.nm').onclick = () => S.toggle(m);
    r.querySelector('.pk')?.addEventListener('change', () => S.toggle(m));
    r.onmouseenter = () => S.hl(m, true); r.onmouseleave = () => S.hl(m, false);
  });
  S.dim(new Set(open.map(m => m.id)));
}

// ---- sleigh hooks ----
S.onPick.push(render);      // stops changed (also saves)
S.onFilter.push(render);    // "How long?" filter
S.onHl.push((m, on) => {
  const r = box.querySelector(`.row[data-id="${m.id}"]`);
  if (!r) return;
  r.classList.toggle('hl', on);
  // only follow hovers that come from the map; never move the panel while the pointer is in it
  if (on && !box.matches(':hover') && r.offsetParent) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
pick(sel);
</script>
</body>
</html>
